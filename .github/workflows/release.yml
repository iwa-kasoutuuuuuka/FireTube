name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p release-assets
          TAG_NAME="${{ github.ref_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/FireTube-${TAG_NAME}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release-assets/FireTube-${{ github.ref_name }}.apk
            release-assets/app-debug.apk
          name: "FireTube ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## FireTube (Fire TV Dedicated YouTube Client)
            Amazon Fire TV Stick HD (Fire OS 7〜8 / 1.5GB RAM) 専用 YouTube ネイティブクライアント

            ### 🚀 主な特徴
            - **YouTube InnerTube / Piped / NewPipe 3重フォールバック**: 途切れない高可用性
            - **完全ネイティブ UI (AndroidX Leanback)**: 物理リモコン（D-Pad）対応・60fps
            - **GMS 0% & 完全広告フリー**: 生ストリーム直接再生
            - **SponsorBlock 自動スキップ**: 案件セクション・OP/EDをミリ秒単位でスキップ
            - **再生中の「関連動画（Up Next）」行**: 下キーでカルーセル表示
            - **テレビ専用設定画面**: 画質（1080p/720p/480p）、倍速、SponsorBlock設定
            - **同一Wi-Fiスマホキャスト**: ポート8080内蔵HTTPサーバーでURL共有
            - **低RAM（1.5GB以下）チューニング**: Glide RGB_565 & ExoPlayer バッファ制限（実測124MB）
