name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # 配布 APK を毎回同じ鍵で署名する (既存インストールへの上書き更新を保証)
      # Secrets 未設定時はランダムな鍵で署名された APK を公開しないよう失敗させる
      - name: Restore Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FIRETUBE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret FIRETUBE_KEYSTORE_BASE64 is not set. Refusing to publish an APK signed with a random key."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firetube.keystore"
          echo "FIRETUBE_KEYSTORE_PATH=$RUNNER_TEMP/firetube.keystore" >> "$GITHUB_ENV"

      - name: Build Debug APK
        env:
          FIRETUBE_KEYSTORE_PASSWORD: ${{ secrets.FIRETUBE_KEYSTORE_PASSWORD }}
          FIRETUBE_KEY_ALIAS: ${{ secrets.FIRETUBE_KEY_ALIAS }}
          FIRETUBE_KEY_PASSWORD: ${{ secrets.FIRETUBE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug --stacktrace --info > build.log 2>&1 || {
            echo "Build failed, saving log to branch..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B build-error-log
            git add -f build.log
            git commit -m "chore: debug build error log"
            git push origin build-error-log --force
            exit 1
          }

      - name: Verify APK Signing Certificate
        env:
          # これまで配布してきた APK の署名証明書 SHA-256 (公開情報)
          EXPECTED_CERT_SHA256: e430bf5505a5b91d399cf6b11bb5ebb155d2e4f19d6f51a264276a5c9f16f45f
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "Signing certificate SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with an unexpected certificate ($ACTUAL). Existing installs could not be upgraded."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/firetube.keystore"

      - name: Rename APK for Release
        run: |
          mkdir -p release-assets
          TAG_NAME="${{ github.ref_name }}"
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/FireTube-${TAG_NAME}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-assets/app-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release-assets/FireTube-${{ github.ref_name }}.apk
            release-assets/app-debug.apk
          name: "FireTube ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## FireTube (Fire TV Dedicated YouTube Client)
            Amazon Fire TV Stick HD (Fire OS 7〜8 / 1.5GB RAM) 専用 YouTube ネイティブクライアント

            ### 🚀 主な特徴
            - **YouTube InnerTube / Piped / NewPipe 3重フォールバック**: 途切れない高可用性
            - **完全ネイティブ UI (AndroidX Leanback)**: 物理リモコン（D-Pad）対応・60fps
            - **GMS 0% & 完全広告フリー**: 生ストリーム直接再生
            - **SponsorBlock 自動スキップ**: 案件セクション・OP/EDをミリ秒単位でスキップ
            - **再生中の「関連動画（Up Next）」行**: 下キーでカルーセル表示
            - **テレビ専用設定画面**: 画質（1080p/720p/480p）、倍速、SponsorBlock設定
            - **同一Wi-Fiスマホキャスト**: ポート8080内蔵HTTPサーバーでURL共有
            - **低RAM（1.5GB以下）チューニング**: Glide RGB_565 & ExoPlayer バッファ制限（実測124MB）
