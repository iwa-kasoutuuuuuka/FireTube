name: Upstream Health Check

# Piped インスタンスや YouTube InnerTube の変化 (アプリのコードでは直せない上流の問題) を定期的に検知する
# 失敗した場合は remote-config.json を更新して main に push すれば、APK を再配布せずアプリへ反映される

on:
  schedule:
    - cron: '17 21 * * 0'   # 毎週月曜 06:17 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'remote-config.json'
      - 'scripts/check_upstream.py'
      - '.github/workflows/upstream-health.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Piped instances and InnerTube search
        run: python3 scripts/check_upstream.py remote-config.json
